[project]
name = "tunisia-distributed-scraper"
version = "0.1.0"
description = "Distributed scraping system for Tunisian retailers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dateutil>=2.9.0",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
headless = ["playwright>=1.45.0"]
ocr = ["rapidocr-onnxruntime>=1.3.24"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
